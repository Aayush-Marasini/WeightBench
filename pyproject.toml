[project]
name = "weightbench"
version = "0.1.0"
description = "WeightBench: an auditable benchmark for AI agents that read, fix and write neural-network weights directly"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",  # TR05-DEAD CROWN/LP reference (silently degrades without it), TR01-BEH occupancy reader
  "torch>=2.4",
  "pyyaml>=6",
  "minatar>=1.0.15",  # TR01-BEH-001 game environments (pulls matplotlib/seaborn)
]

[project.optional-dependencies]
lm = ["transformers>=4.50", "accelerate>=0.34", "huggingface_hub>=0.25", "safetensors>=0.4", "datasets>=3"]
dev = ["pytest>=8", "gymnasium>=1.0"]  # CPU control-dynamics cross-checks
tr01 = ["pykakasi>=2.3"]  # TR01-ESC corpus build (romaji); only needed where corpora are built
tr02ctrl = ["kinetix-env==3.0.2", "jax==0.9.0", "jaxlib==0.9.0", "gymnasium>=1.0"]  # TR02-CTRL (Kinetix car ramp; gymnasium only for dynamics cross-check tests)

[project.scripts]
weightbench = "weightbench.cli:main"
weightbench-report = "weightbench.report:main"
weightbench-calibrate = "weightbench.calibrate:main"
weightbench-leaderboard = "weightbench.leaderboard:main"
weightbench-verify = "weightbench.verify:main"
weightbench-manifest = "weightbench.manifest:main"
weightbench-compare = "weightbench.comparison:main"

[tool.pytest.ini_options]
markers = ["gpu: needs a GPU / large model", "knob: empirical knob-difficulty checks"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weightbench"]

[tool.hatch.build.targets.wheel.force-include]
"configs/scoring" = "weightbench/_scoring_configs"
